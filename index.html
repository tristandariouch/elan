,description:'Concevoir une stratégie éditoriale, coordonner les contenus et les campagnes. 5 ans d’expérience en communication. Français courant et anglais professionnel obligatoires. Connaissance des outils analytiques appréciée.',demo:true}];function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));if($('nav-'+page))$('nav-'+page).classList.add('active');$('count').textContent=state.saved.length?`(${state.saved.length})`:'';if(page==='home')home();if(page==='result')result();if(page==='saved')saved();if(page==='profile')profile();if(page==='documents')documents()}function setHomeTab(t){homeTab=t;render()}function home(){const p=state.profile;$('app').innerHTML=`<section class="hero"><div class="eyebrow">VOTRE PARCOURS A PLUS D’UNE DIRECTION</div><h1>Cette offre est-elle<br><em>faite pour vous ?</em></h1><p class="muted">Comprenez ce qui correspond, ce qui se transfère et ce qui manque.</p></section><div class="switch" aria-label="Choisir un point de départ"><button class="${homeTab==='paste'?'active':''}" onclick="setHomeTab('paste')">↗ &nbsp; J’ai une offre</button><button class="${homeTab==='suggested'?'active':''}" onclick="setHomeTab('suggested')">✧ &nbsp; Suggestions</button></div>${homeTab==='paste'?`<section class="import"><div class="step-label"><span>VOTRE OFFRE</span><button class="quiet small" style="padding:0" onclick="go('profile')">◯ Profil : ${escapeHtml(p.name.split(' ')[0])} · modifier ↗</button></div><div class="inputmodes"><button class="${mode==='link'?'active':''}" onclick="mode='link';home()">Coller un lien</button><button class="${mode==='text'?'active':''}" onclick="mode='text';home()">Coller la description</button></div>${mode==='link'?`<form onsubmit="event.preventDefault();readLink()"><div class="inputrow"><input id="offerLink" type="url" aria-label="Lien de l’offre" placeholder="https://www.linkedin.com/jobs/view/…" required><button class="primary" type="submit">Continuer →</button></div></form><p class="note">LinkedIn ou un autre site d’emploi.</p><div id="linkNotice"></div>`:`<form onsubmit="event.preventDefault();analyzeText()"><textarea id="offerText" aria-label="Description et profil recherché" placeholder="Collez ici la description du poste et le profil recherché…" required></textarea><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:12px"><span class="note" style="margin:0">Votre profil est déjà renseigné.</span><button class="primary" type="submit">Comparer à mon profil →</button></div></form>`}<div class="example"><div><p class="tiny"><b>Envie de voir le résultat ?</b></p><p class="note" style="margin:3px 0 0">Communication → gestion de projets</p></div><button onclick="analyzeExample(0)">Essayer un exemple ↗</button></div></section><div class="journey"><span><b class="circle">1</b> Ajoutez une offre</span><span><b class="circle">2</b> Explorez les correspondances</span><span><b class="circle">3</b> Décidez de la suite</span></div>`:`<section><div class="suggest-head"><div><h2>Et si vous exploriez ces pistes ?</h2><p class="muted tiny">Trois exemples pour parcourir le prototype.</p></div><button class="quiet small" onclick="go('profile')">Affiner mon profil ↗</button></div><div class="offers">${alternatives.map((j,i)=>state.dismissed?.includes(j.id)?'':`<article class="offer"><div class="logo">${i===0?'a.':i===1?'H':'b'}</div><p>${escapeHtml(j.company)}</p><h3>${escapeHtml(j.title)}</h3><p>${escapeHtml(j.place)}</p><span class="chip">${i===0?'↗ Une passerelle possible':i===1?'◌ Condition ACS à vérifier':'✓ Dans votre domaine'}</span><button onclick="analyzeExample(${i})">Voir la correspondance →</button></article>`).join('')}</div></section>`}<p class="bottomnote">Prototype interactif · profil et offres de démonstration · aucune IA connectée</p>`}function readLink(){const raw=$('offerLink').value;try{const u=new URL(raw);if(!['http:','https:'].includes(u.protocol))throw Error();}catch{toast('Ajoutez un lien commençant par https://');return}sessionStorage.setItem('elan-link',raw);$('linkNotice').innerHTML=`<div class="alert" style="margin:16px 0 0">Le lien est conservé. La lecture automatique des annonces n’est pas connectée dans ce prototype : collez le texte de l’offre pour continuer.</div><button class="quiet small" onclick="mode='text';home()" style="margin-top:10px">Coller la description →</button>`}function analyzeText(){const text=$('offerText').value.trim();if(text.length<40){toast('Ajoutez la description et le profil recherché pour continuer.');return}active={id:'custom-'+Date.now(),title:'Votre offre importée',company:'Entreprise à préciser',place:'Annonce ajoutée par vous',description:text,demo:false,source:sessionStorage.getItem('elan-link')||''};go('result')}function analyzeExample(i){active=structuredClone(alternatives[i]);go('result')}function panel(icon,title,sub,cls,items){return `<article class="panel ${cls}"><div class="icon">${icon}</div><h3>${title}</h3><p>${sub}</p>${items.map(x=>`<div class="evidence"><div class="label">${x[0]}</div><div class="skill">${x[1]}</div><div class="arrow">↓</div><div class="detail">${x[2]}</div></div>`).join('')}</article>`}function result(){const j=active,isFirst=j.id==='example-project',isCulture=j.id==='example-culture';$('app').innerHTML=`<button class="back" onclick="go('home')">← Revenir aux offres</button><div class="result-heading"><div class="company"><span class="logo">${j.demo?'a.':'↗'}</span><div><h1>${escapeHtml(j.title)}</h1><p class="muted tiny">${escapeHtml(j.company)} · ${escapeHtml(j.place)}</p></div></div><span class="chip">${j.demo?'Exemple de correspondance':'Analyse à compléter'}</span></div>${j.demo?`<section class="summary"><div class="summary-icon">${isCulture?'◌':'↗'}</div><div><h2>${isFirst?'Un changement de métier, pas un départ de zéro.':isCulture?'Votre parcours correspond. Une condition reste à vérifier.':'Une piste dans la continuité de votre parcours.'}</h2><p>${isFirst?'Votre expérience en communication peut soutenir un rôle en gestion de projets. Voici les liens à examiner.':isCulture?'L’expérience culturelle est pertinente. L’éligibilité ACS doit être confirmée avant de préparer le dossier.':'Les expériences de communication sont pertinentes. Les outils demandés méritent d’être précisés.'}</p></div></section><div class="result-grid">${panel('✓','Ce qui correspond','Des points d’appui déjà dans votre parcours.','',[['EXPÉRIENCE',isFirst?'Coordination de projets':'Communication et projets',isFirst?'Demandé : 3 ans. Profil de démo : 6 ans en communication et coordination.':'Expérience pertinente présente dans le profil de démonstration.'],['LANGUES','Français et anglais','Français courant et anglais B2 dans le profil. Le niveau précis attendu en anglais reste à confirmer.']])}${panel('↗','Ce qui se transfère','Une autre façon de valoriser votre expérience.','transfer',isFirst?[['VOTRE EXPÉRIENCE','Campagnes de communication','→ Planifier des étapes, des livrables et des échéances.'],['VOTRE EXPÉRIENCE','Partenariats et ateliers','→ Coordonner des interlocuteurs et animer un groupe.']]:[['VOTRE EXPÉRIENCE','Organisation d’événements','→ Coordonner des projets, des équipes et des prestataires.'],['À ÉTAYER','Gestion des parties prenantes','Ajoutez un exemple précis de partenariat ou d’atelier.']])}${panel('◌','Ce qui reste à vérifier','Pour décider avec les bonnes informations.','gaps',isCulture?[['OBLIGATOIRE','Éligibilité ACS','Votre statut n’est pas confirmé. À vérifier avant de candidater.'],['À PRÉCISER','Budget de projet','Le profil ne décrit pas de budget géré. Ajoutez un exemple si vous en avez.']]:[['COMPÉTENCE À PRÉCISER',isFirst?'Suivi de budget et outils projet':'Outils analytiques','Pas d’élément précis dans le profil. Cela ne signifie pas que vous ne savez pas le faire.'],['À DOCUMENTER',isFirst?'Secteur de la transition':'Résultats des campagnes',isFirst?'Présenté comme un atout dans l’offre. Cherchez un projet ou un engagement pertinent.':'Ajoutez des résultats concrets si vous en disposez.']])}</div><p class="note">Illustration éditoriale basée sur le profil de démonstration initial. Modifier le profil ne recalcule pas cet exemple.</p>`:`<section class="summary"><div class="summary-icon">◌</div><div><h2>Votre offre est prête à être examinée.</h2><p>Le moteur de comparaison n’est pas connecté. Aucune correspondance n’a été calculée à partir de ce texte.</p></div></section><div class="result-grid">${panel('✓','Ce qui correspond','Vos points d’appui.','',[['VOTRE PROFIL','Expériences et langues',escapeHtml(state.profile.experience+' '+state.profile.languages)]])}${panel('↗','Ce qui se transfère','Les passerelles à explorer.','transfer',[['VOTRE OBJECTIF','Un changement de direction ?',escapeHtml(state.profile.target)],['VOTRE ANALYSE','Vos compétences transférables','Ajoutez une passerelle entre votre expérience et les missions du poste.']])}${panel('◌','Ce qui reste à vérifier','Les exigences de cette offre.','gaps',[['CONDITIONS','Langues, expérience, statut','Relisez les exigences obligatoires dans le texte ci-dessous.'],['VOTRE SITUATION','Conditions d’accès',escapeHtml(state.profile.conditions)]])}</div><label style="display:block;margin-top:20px;font-size:13px">Vos notes de correspondance<textarea id="customNotes" placeholder="Ce qui correspond, les passerelles possibles, les points à vérifier…" oninput="active.notes=this.value" style="min-height:100px">${escapeHtml(j.notes||'')}</textarea></label>`}<details class="expanded"><summary>Relire l’annonce complète</summary><div class="panel" style="margin-top:15px"><p>${escapeHtml(j.description)}</p></div></details><div class="bottom-action"><div><b class="tiny">Et maintenant, à vous de choisir.</b><p class="muted">Gardez cette piste ou commencez votre dossier.</p></div><div style="display:flex;gap:10px"><button onclick="keep(false)">♡ Garder pour plus tard</button><button class="primary" onclick="keep(true)">Préparer ma candidature →</button></div></div>`}function keep(prepare){if(!state.saved.some(x=>x.id===active.id))state.saved.unshift({...active,status:'saved'});else{const i=state.saved.findIndex(x=>x.id===active.id);state.saved[i]={...state.saved[i],...active}}save();$('count').textContent=`(${state.saved.length})`;if(prepare)go('documents');else toast('Piste enregistrée dans « Mes pistes ».')}function saved(){ $('app').innerHTML=`<div class="hero" style="text-align:left"><div class="eyebrow">POUR QUAND VOUS SEREZ PRÊT·E</div><h1>Vos pistes, au même endroit.</h1><p class="muted">Retrouvez votre réflexion et reprenez là où vous en étiez.</p></div>${state.saved.length?state.saved.map((j,i)=>`<section class="panel" style="margin-bottom:14px"><div class="savedrow"><div><span class="status">${j.status==='sent'?'Envoyée':j.status==='draft'?'En préparation':'Pour plus tard'}</span><h3 style="margin-top:12px">${escapeHtml(j.title)}</h3><p class="muted tiny">${escapeHtml(j.company)}</p></div><div><button class="small" onclick="loadSaved(${i},false)">Revoir la correspondance</button> <button class="primary small" onclick="loadSaved(${i},true)">Ouvrir le dossier →</button></div></div></section>`).join(''):`<div class="panel empty"><h2>Une piste vous plaît ? Gardez-la ici.</h2><p class="muted">Vous retrouverez aussi votre analyse et vos notes.</p><button class="primary" style="margin-top:15px" onclick="go('home')">Explorer une offre →</button></div>`}`}function loadSaved(i,doc){active={...state.saved[i]};go(doc?'documents':'result')}function oldProfile(){const p=state.profile;$('app').innerHTML=`<button class="back" onclick="go('home')">← Revenir à mon offre</button><section class="profile-form"><div class="eyebrow">VOTRE POINT DE DÉPART</div><h1>Votre parcours compte.</h1><p class="muted">Décrivez vos expériences, même celles qui ne portent pas le titre du métier visé.</p><div class="panel" style="margin-top:25px"><label for="pname">Nom</label><input id="pname" value="${escapeHtml(p.name)}"><label for="pexperience">Vos expériences et compétences</label><textarea id="pexperience">${escapeHtml(p.experience)}</textarea><label for="planguages">Vos langues et niveaux</label><input id="planguages" value="${escapeHtml(p.languages)}"><label for="pconditions">Conditions d’accès : droit de travail, ACS…</label><textarea id="pconditions">${escapeHtml(p.conditions)}</textarea><label for="ptarget">Vers quoi aimeriez-vous évoluer ?</label><textarea id="ptarget">${escapeHtml(p.target)}</textarea><button class="primary" onclick="saveProfile()">Enregistrer et explorer →</button><p class="note">La conversation vocale et l’import de CV viendront dans une prochaine version.</p></div></section>`}function oldSaveProfile(){state.profile={name:$('pname').value,experience:$('pexperience').value,languages:$('planguages').value,conditions:$('pconditions').value,target:$('ptarget').value};save();go('home');toast('Profil enregistré.')}function documents(){const j=state.saved.find(x=>x.id===active.id);if(!j){go('home');return}$('app').innerHTML=`<section class="document"><button class="back" onclick="go('result')">← Revenir aux correspondances</button><div class="eyebrow">LA SUITE, SI VOUS LE SOUHAITEZ</div><h1>Construisons votre dossier.</h1><p class="muted">${escapeHtml(j.title)} · ${escapeHtml(j.company)}</p><div class="panel" style="margin-top:25px"><h3>Votre lettre, avec vos mots.</h3><p class="tiny muted">Trame à compléter. Aucune rédaction IA connectée dans cette démo.</p><textarea id="letter" aria-label="Lettre de motivation" oninput="updateLetter()">${escapeHtml(j.letter||`Madame, Monsieur,\n\nJe souhaite vous proposer ma candidature au poste de ${j.title}.\n\n[Présentez une expérience pertinente et un résultat concret.]\n\n[En cas de reconversion, expliquez comment vos compétences se transfèrent aux missions du poste.]\n\n[Décrivez votre intérêt pour l’entreprise.]\n\n${state.profile.name}`)}</textarea><div style="display:flex;gap:10px;flex-wrap:wrap"><button onclick="download()">↓ Télécharger le texte</button><button class="primary" onclick="markSent()">J’ai envoyé ma candidature ✓</button></div><p class="note">Le CV et la mise en page des documents seront traités après validation de ce parcours.</p></div></section>`}function updateLetter(){const j=state.saved.find(x=>x.id===active.id);j.letter=$('letter').value;if(j.status!=='sent')j.status='draft';save()}function markSent(){updateLetter();state.saved.find(x=>x.id===active.id).status='sent';save();go('saved');toast('Candidature marquée comme envoyée.')}function download(){updateLetter();const url=URL.createObjectURL(new Blob([state.saved.find(x=>x.id===active.id).letter],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='lettre-motivation.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
let profileTab='journey',skillProposal=null;
state.profile.skills ||= ['Communication','Relation client','Coordination de projets'];
state.profile.examples ||= [];
state.profile.belgium ||= {region:'unknown',work:'unknown',registration:'unknown',acs:'unknown',ape:'unknown'};
state.profile.tone ||= 'light';
function changeProfileTab(t){saveProfileFields();profileTab=t;profile()}
function selectField(id,label,values,value){return `<label for="${id}">${label}</label><select id="${id}">${values.map(([v,t])=>`<option value="${v}" ${v===value?'selected':''}>${t}</option>`).join('')}</select>`}
function conditionRow(key,title,explanation,url,source){const val=state.profile.belgium[key]||'unknown';return `<div class="condition"><details><summary><b>${title}</b> <span class="muted">* C’est quoi ?</span></summary><p>${explanation}</p><p><a href="${url}" target="_blank" rel="noopener">Vérifier sur ${source} ↗</a></p></details><div class="radios">${[['yes','Oui, confirmé'],['no','Non'],['unknown','Je ne sais pas']].map(([v,t])=>`<label><input type="radio" name="${key}" value="${v}" ${val===v?'checked':''} onchange="state.profile.belgium['${key}']=this.value;save()">${t}</label>`).join('')}</div></div>`}
function profile(){const p=state.profile,b=p.belgium;$('app').innerHTML=`<button class="back" onclick="saveProfileFields();go('home')">← Revenir aux offres</button><section class="profile-form"><div class="eyebrow">UN PROFIL QUI VA AU-DELÀ DES INTITULÉS</div><h1>${p.tone==='light'?'Vous n’êtes pas qu’une liste de postes.':'Votre expérience a plus à raconter.'}</h1><p class="muted">Complétez une partie à la fois. Vous pourrez toujours y revenir.</p><div class="profile-tabs">${[['journey','1 · Mon parcours'],['skills','2 · Mes compétences'],['conditions','3 · Ma situation'],['tone','4 · Mon ambiance']].map(([v,t])=>`<button class="${profileTab===v?'active':''}" onclick="changeProfileTab('${v}')">${t}</button>`).join('')}</div><div class="panel">${profileTab==='journey'?`<h2>On part de ce que vous avez fait.</h2><p class="tiny muted">Un CV, quelques exemples, ou vos propres mots.</p><div class="cvdrop"><b class="tiny">Importer mon CV</b><input type="file" id="cvFile" accept=".pdf,.docx,.txt" onchange="readCV(this)"><p class="note">Démo : le texte .txt peut être repris ci-dessous. La lecture des PDF et Word n’est pas encore connectée. Aucun fichier n’est envoyé.</p><p id="cvStatus" class="tiny" role="status"></p></div><label for="pname">Votre nom</label><input id="pname" value="${escapeHtml(p.name)}"><label for="pexperience">Expériences, responsabilités et résultats</label><textarea id="pexperience" style="min-height:150px" placeholder="Poste, entreprise, dates, missions et résultats…">${escapeHtml(p.experience)}</textarea><label for="pstudies">Études, diplômes et certifications</label><textarea id="pstudies" placeholder="Diplôme, établissement, année…">${escapeHtml(p.studies||'')}</textarea><label>Langues et niveaux</label>${languageEditor()}<label for="ptarget">Votre prochaine direction</label><textarea id="ptarget">${escapeHtml(p.target)}</textarea>${orientationEditor()}`:profileTab==='skills'?`<h2>Les compétences derrière vos missions.</h2><p class="tiny muted">Gardez les mots-clés qui vous ressemblent et appuyez-les sur des faits.</p><div class="skills">${p.skills.map((x,i)=>`<button onclick="removeSkill(${i})" title="Retirer cette compétence">${escapeHtml(x)} ×</button>`).join('')}</div><form class="inputrow" onsubmit="event.preventDefault();addSkill()"><input id="newSkill" aria-label="Nouvelle compétence" placeholder="Ajouter une compétence…"><button type="submit">＋ Ajouter</button></form><div class="promptchips">${['Gestion de projet','Animation d’ateliers','Planification','Analyse de données'].map(x=>`<button onclick="addSkillValue('${x}')">＋ ${x}</button>`).join('')}</div><div class="bubble"><b>Un échange pour trouver les bons mots</b><p>Quand vous gériez des clients, que faisiez-vous concrètement ? Par exemple : recueillir les besoins, coordonner des équipes, suivre les délais ?</p><p class="note">Conversation guidée de démonstration, sans IA connectée.</p></div><label for="skillStory">Racontez une situation précise</label><textarea id="skillStory" placeholder="Par exemple : en marketing, je centralisais les demandes de cinq clients et organisais les livraisons avec les créatifs…">${escapeHtml(p.story||'')}</textarea><div class="oral-row"><button onclick="voiceDemo('skillStory')">♩ Raconter à voix haute</button><span class="note">Parcours vocal simulé</span></div><button class="primary" onclick="exploreStory()">Faire le point ensemble →</button><button class="quiet small" onclick="$('skillStory').value='Je centralisais les demandes de cinq clients, coordonnais les livraisons avec les créatifs et suivais les délais.';exploreStory()">Essayer un exemple</button><div id="skillProposal"></div>${p.examples.length?`<h3 style="margin-top:25px">Vos exemples validés</h3>${p.examples.map((e,i)=>`<div class="bubble"><b>${escapeHtml(e.skill)}</b><p>${escapeHtml(e.phrase)}</p><p class="note">Votre exemple : ${escapeHtml(e.evidence)}</p><button class="quiet small" onclick="state.profile.examples.splice(${i},1);save();profile()">Retirer</button></div>`).join('')}`:''}`:profileTab==='conditions'?`<h2>Les conditions, en langage clair.</h2><p class="tiny muted">Ce ne sont pas des compétences. Certaines offres exigent une situation ou une attestation précise.</p>${selectField('pregion','Votre région de domicile',[['unknown','Je préfère préciser plus tard'],['brussels','Bruxelles-Capitale'],['wallonia','Wallonie'],['flanders','Flandre'],['other','Hors de Belgique']],b.region)}${selectField('pregistration','Inscription comme chercheur d’emploi',[['unknown','Je ne sais pas / à préciser'],['actiris','Actiris'],['forem','Le Forem'],['vdab','VDAB'],['adg','Arbeitsamt / ADG'],['none','Pas d’inscription']],b.registration)}${conditionRow('work','Droit de travailler en Belgique','Avoir un titre de séjour et être autorisé à travailler sont deux choses à vérifier. Selon votre situation, une autorisation de travail peut être nécessaire. Si vous hésitez, choisissez « Je ne sais pas ».','https://www.actiris.brussels/fr/citoyens/qui-peut-sinscrire-et-quand/','Actiris')}${b.region==='brussels'||b.region==='unknown'?conditionRow('acs','ACS · Bruxelles','Une aide à l’employeur pour certains emplois, notamment en ASBL. Il faut être domicilié à Bruxelles et inscrit comme chercheur d’emploi inoccupé chez Actiris. D’autres conditions dépendent de l’offre : Actiris confirme votre éligibilité et délivre l’attestation.','https://www.actiris.brussels/fr/citoyens/agents-contractuels-subventionnes/','Actiris'):''}${b.region==='wallonia'||b.region==='unknown'?conditionRow('ape','APE · Wallonie','Une aide à certains employeurs wallons. Depuis janvier 2026, l’inscription comme chercheur d’emploi est généralement requise depuis au moins 4 mois, avec des exceptions. Faites vérifier votre situation auprès du Forem pour l’engagement concerné.','https://www.leforem.be/citoyens/aides-financieres/aides-promotion-emploi.html','Le Forem'):''}<details class="expanded"><summary>Une annonce mentionne activa.brussels ?</summary><p>La mesure est on class="primary" style="margin:0" onclick="saveProfileFields();toast('Profil enregistré.');${profileTab==='journey'?"profileTab='skills';profile()":profileTab==='skills'?"profileTab='conditions';profile()":profileTab==='conditions'?"profileTab='tone';profile()":"go('home')"}">${profileTab==='tone'?'Revenir aux offres':'Enregistrer et continuer →'}</button></div></div></section>`;if($('pregion'))$('pregion').onchange=()=>{saveProfileFields();profile()};if($('pregistration'))$('pregistration').onchange=()=>saveProfileFields();if(skillProposal&&profileTab==='skills')drawProposal()}
function saveProfileFields(){const p=state.profile;for(const [id,key] of [['pname','name'],['pexperience','experience'],['pstudies','studies'],['planguages','languages'],['ptarget','target'],['pconditions','conditions'],['skillStory','story']])if($(id))p[key]=$(id).value;if($('pregion'))p.belgium.region=$('pregion').value;if($('pregistration'))p.belgium.registration=$('pregistration').value;save()}
async function readCV(input){const f=input.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.txt')){$('cvStatus').textContent='Fichier sélectionné : '+f.name+'. L’extraction PDF / Word sera disponible dans une prochaine version.';return}try{if(f.size>500000){$('cvStatus').textContent='Choisissez un fichier texte de moins de 500 Ko.';return}const text=await f.text();$('pexperience').value=text;$('cvStatus').textContent='Texte repris ci-dessous : relisez et complétez avant de valider.'}catch{$('cvStatus').textContent='Lecture impossible. Vous pouvez coller le texte ci-dessous.'}}

const journeyHome=home;home=function(){journeyHome();const raw=$('app').innerHTML;const start=raw.indexOf('<div class="switch"');const rest=raw.slice(start).replace('<div class="switch"','<div id="start" class="switch"');$('app').innerHTML=`<section class="landing-top"><div><div class="eyebrow">MOINS D’ONGLETS. PLUS DE DIRECTION.</div><h1>De l’offre au retour,<br><em>un seul fil à suivre.</em></h1><p class="muted">Comprenez une offre, préparez votre candidature et retrouvez chaque prochaine étape au même endroit.</p><div class="landing-cta"><button class="primary" onclick="startHere('paste')">J’ai une offre →</button><button onclick="startHere('suggested')">Voir les suggestions</button></div><p class="note">Votre expérience reste le point de départ. Vous gardez la décision.</p></div><section class="explain-player" aria-label="Présentation animée du parcours"><div class="player-top"><span>COMMENT ÇA MARCHE</span><span>5 ÉTAPES · AVEC NARRATION</span></div><div id="playerStage" class="player-stage"></div><div class="player-controls"><button class="primary" id="playGuide" onclick="toggleGuide()">▶ Découvrir le parcours</button><div class="scene-dots">${scenes.map((x,i)=>`<button aria-label="Étape ${i+1}" id="dot${i}" onclick="selectScene(${i})"></button>`).join('')}</div><button class="quiet" onclick="selectScene((sceneIndex+1)%5)">Suivante →</button></div></section></section><section class="journey-rail">${[['Une offre','Collée ou suggérée'],['Une décision','Correspondance expliquée'],['Vos documents','CV et lettre à valider'],['Votre envoi','Plateforme ou e-mail'],['Le suivi','Relance, retour, progrès']].map(([t,d],i)=>`<div class="rail-step"><b>${i+1}</b><div>${t}<span>${d}</span></div></div>`).join('')}</section><section class="start-heading"><h2>Commençons par une offre.</h2><p class="muted tiny">Deux portes d’entrée, puis le même accompagnement.</p></section>${rest}<details class="transcript"><summary>Lire le texte de la présentation · accessibilité</summary>${scenes.map(x=>`<p><b>${x.title}</b> ${x.text}</p>`).join('')}</details>`;drawScene();};
function startHere(tab){stopGuide();homeTab=tab;home();$('start').scrollIntoView({behavior:'smooth',block:'start'})}
function drawScene(){if(!$('playerStage'))return;const x=scenes[sceneIndex];$('playerStage').innerHTML=`<div class="scene-art" aria-hidden="true"><div class="scene-tile"><strong>${x.left}</strong><span>${x.ll}</span></div><span class="scene-arrow">⟶</span><div class="scene-tile"><strong>${x.right}</strong><span>${x.rl}</span></div></div><h3>${x.title}</h3><p>${x.text}</p>`;scenes.forEach((x,i)=>{if($('dot'+i))$('dot'+i).className=i===sceneIndex?'on':''});if($('playGuide'))$('playGuide').textContent=guidePlaying?'Ⅱ Pause':'▶ Découvrir le parcours'}
function stopGuide(){guidePlaying=false;if(guideTimer)clearTimeout(guideTimer);guideTimer=null;if('speechSynthesis' in window)window.speechSynthesis.cancel();if($('playGuide'))$('playGuide').textContent='▶ Découvrir le parcours'}
function playScene(){drawScene();const next=()=>{if(!guidePlaying)return;if(sceneIndex<4){sceneIndex++;playScene()}else{stopGuide();drawScene()}};if('speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined'){const u=new SpeechSynthesisUtterance(scenes[sceneIndex].title+' '+scenes[sceneIndex].text);u.lang='fr-FR';u.rate=.98;u.onend=()=>{if(guideTimer)clearTimeout(guideTimer);guideTimer=setTimeout(next,650)};u.onerror=()=>{if(guideTimer)clearTimeout(guideTimer);guideTimer=setTimeout(next,8000)};window.speechSynthesis.speak(u);guideTimer=setTimeout(next,22000)}else guideTimer=setTimeout(next,10000)}
function toggleGuide(){if(guidePlaying){stopGuide();drawScene();return}if(sceneIndex===4)sceneIndex=0;guidePlaying=true;playScene()}
function selectScene(i){stopGuide();sceneIndex=i;drawScene()}
const originalGo=go;go=function(p){stopGuide();originalGo(p)};
const decisionResult=result;result=function(){decisionResult();$('app').insertAdjacentHTML('afterbegin',positionStep(2));const old=document.querySelector('.bottom-action');if(old)old.outerHTML=`<section class="decision"><h3>Cette piste vous donne envie de continuer ?</h3><p class="tiny muted">Vous n’avez pas besoin de cocher toutes les préférences. Les conditions obligatoires restent à vérifier.</p><div class="feedback-row"><button class="primary" onclick="docTab='cv';keep(true)">Oui, préparer mon CV et ma lettre →</button><button onclick="keep(false)">Je garde pour plus tard</button><button class="quiet" onclick="dismissOffer()">Non, je passe</button></div></section>`;};
function dismissOffer(){state.dismissed ||= [];state.dismissed.push(active.id);save();go('home');toast('Piste écartée. Vous pouvez explorer une autre offre.')}
function getDossier(){return state.saved.find(x=>x.id===active.id)}
function ensureDossierText(j){if(!j.cv)j.cv=state.profile.name+'\n\nPROFIL\n'+state.profile.target+'\n\nEXPÉRIENCES\n'+state.profile.experience+'\n\nCOMPÉTENCES\n'+state.profile.skills.join(' · ')+'\n\nLANGUES\n'+state.profile.languages+'\n\nFORMATION\n'+(state.profile.studies||'[Complétez vos diplômes et certifications]');if(!j.letter)j.letter='Madame, Monsieur,\n\nJe souhaite vous proposer ma candidature au poste de '+j.title+'.\n\n[Présentez une expérience pertinente avec un résultat concret.]\n\n[Expliquez comment vos compétences peuvent servir les missions de ce poste.]\n\n[Précisez votre intérêt pour cette organisation.]\n\nJe serais heureux·se d’échanger avec vous.\n\n'+state.profile.name;}
documents=function(){const j=getDossier();if(!j){go('home');return}ensureDossierText(j);$('app').innerHTML=positionStep(3)+`<button class="back" onclick="go('result')">← Revoir la correspondance</button><div class="eyebrow">LE DOSSIER PREND FORME</div><h1>Votre CV. Votre lettre. Votre voix.</h1><p class="muted">Un point de départ modifiable, puis votre validation.</p><div class="document-layout"><div class="document-nav"><button class="${docTab==='cv'?'active':''}" onclick="saveDocument();docTab='cv';documents()">▤ Mon CV</button><button class="${docTab==='letter'?'active':''}" onclick="saveDocument();docTab='letter';documents()">✎ Ma lettre</button><button onclick="downloadDocument()">↓ Télécharger le texte</button></div><section class="paper-preview"><div class="paper-header"><span class="eyebrow">${docTab==='cv'?'CURRICULUM VITAE':'LETTRE DE MOTIVATION'}</span><h2>${escapeHtml(state.profile.name)}</h2><p class="tiny muted">${escapeHtml(j.title)} · ${escapeHtml(j.company)}</p></div><textarea id="documentText" aria-label="${docTab==='cv'?'CV modifiable':'Lettre modifiable'}" oninput="saveDocument()">${escapeHtml(j[docTab])}</textarea></section></div><p class="note">Prototype : CV assemblé depuis votre profil et lettre à compléter, sans adaptation IA. Téléchargement .txt ; mise en page PDF à venir.</p><div class="bottom-action"><span class="tiny muted">Relisez les faits, les dates et les formulations avant d’envoyer.</span><button class="primary" onclick="saveDocument();openSend()">Mes documents sont prêts →</button></div>`;save()};
function saveDocument(){const j=getDossier();if(j&&$('documentText')){j[docTab]=$('documentText').value;if(j.status!=='sent')j.status='draft';save()}}
function downloadDocument(){saveDocument();const j=getDossier();const url=URL.createObjectURL(new Blob([j[docTab]],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=docTab==='cv'?'cv.txt':'lettre-motivation.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeURL(raw){try{const u=new URL(raw);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function openSend(){const j=getDossier();$('app').innerHTML=positionStep(4)+`<button class="back" onclick="go('documents')">← Revenir aux documents</button><h1>Prêt·e pour la prochaine étape ?</h1><p class="muted">Choisissez où postuler, puis confirmez quand votre candidature est réellement envoyée.</p><div class="send-grid" style="margin-top:25px"><section class="send-choice"><h2>↗ Sur la plateforme</h2><p class="tiny muted">LinkedIn, Glassdoor, Student.be ou le site de l’employeur.</p><label class="tiny">Lien exact de l’annonce<input id="applicationURL" type="url" placeholder="https://…" value="${escapeHtml(j.source||'')}"></label><button onclick="openPlatform()">Ouvrir l’annonce ↗</button><p id="platformHint" class="note">Vous déposerez vos documents sur la plateforme.</p></section><section class="send-choice"><h2>✉ Par e-mail</h2><label class="tiny">Nom du contact<input id="recruiterName" value="${escapeHtml(j.recruiterName||'')}" placeholder="Nom du recruteur, si connu"></label><label class="tiny">Adresse du destinataire<input id="recruiterEmail" type="email" value="${escapeHtml(j.recruiterEmail||'')}" placeholder="Adresse communiquée dans l’annonce"></label><button onclick="prepareApplicationEmail()">Préparer l’e-mail ↗</button><p class="note">Ouvre votre application e-mail. Ajoutez les documents avant d’envoyer.</p></section></div><section class="decision"><h3>Vous avez terminé l’envoi ?</h3><p class="tiny muted">Ouvrir un lien ou un brouillon ne confirme pas l’envoi. Dans cette démo, vous l’indiquez vous-même.</p><label class="tiny">Canal utilisé<select id="sentChannel"><option>LinkedIn</option><option>Glassdoor</option><option>Student.be</option><option>Site employeur</option><option>E-mail</option><option>Autre plateforme</option></select></label><button class="primary" style="margin-top:15px" onclick="confirmApplication()">Oui, j’ai envoyé ma candidature ✓</button></section>`;}
function captureContact(){const j=getDossier();if($('recruiterName'))j.recruiterName=$('recruiterName').value.trim();if($('recruiterEmail'))j.recruiterEmail=$('recruiterEmail').value.trim();if($('applicationURL'))j.source=$('applicationURL').value.trim();save();return j}
function openPlatform(){const j=captureContact(),url=safeURL(j.source);if(!url){toast('Ajoutez le lien exact de l’annonce.');return}window.open(url,'_blank','noopener,noreferrer');$('platformHint').textContent='Annonce ouverte. Revenez confirmer après avoir postulé.'}
function validEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)}
function prepareApplicationEmail(){const j=captureContact();if(!validEmail(j.recruiterEmail)){toast('Ajoutez une adresse e-mail valide.');return}const subject='Candidature — '+j.title;const body=(j.recruiterName?'Bonjour '+j.recruiterName+',':'Bonjour,')+'\n\nJe vous adresse ma candidature au poste de '+j.title+'. Vous trouverez mon CV et ma lettre en pièces jointes.\n\nBien cordialement,\n'+state.profile.name;window.location.href='mailto:'+encodeURIComponent(j.recruiterEmail)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);toast('Brouillon préparé. Pensez aux pièces jointes.')}
function confirmApplication(){const j=captureContact();j.status='sent';j.sentChannel=$('sentChannel').value;j.sentAt=new Date().toISOString();j.confirmation='Déclaré par vous';j.reminder=j.reminder||new Date(Date.now()+7*86400000).toISOString().slice(0,10);save();go('saved');toast('Candidature enregistrée dans votre suivi.')}
saved=function(){$('app').innerHTML=positionStep(5)+`<div class="eyebrow">APRÈS L’ENVOI, LE FIL CONTINUE</div><h1>Chaque candidature a sa suite.</h1><p class="muted">Retrouvez l’envoi, la prochaine relance et les enseignements d’un retour.</p><div class="connectbox"><div><b class="tiny">✉ Retrouver les réponses dans votre boîte mail</b><p>Une future connexion pourra rapprocher les confirmations et les réponses de vos dossiers.</p></div><button class="small" onclick="toast('Connexion e-mail à venir. Aucun compte connecté dans ce prototype.')">Connexion e-mail · aperçu</button></div>${state.saved.length?state.saved.map((j,i)=>`<section class="tracking-card"><div class="tracking-head"><div><h3>${escapeHtml(j.title)}</h3><p class="muted tiny">${escapeHtml(j.company)}</p></div><select aria-label="État de la candidature" onchange="setTracking(${i},this.value)">${[['saved','Pour plus tard'],['draft','En préparation'],['sent','Envoyée'],['interview','Entretien'],['rejected','Réponse négative']].map(([v,t])=>`<option value="${v}" ${j.status===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="tracking-meta">${j.sentAt?`<span>✓ ${escapeHtml(j.sentChannel||'Canal à préciser')} · ${new Date(j.sentAt).toLocaleDateString('fr-BE')} · ${escapeHtml(j.confirmation||'Déclaré par vous')}</span>`:'<span>Pas encore d’envoi enregistré</span>'}${j.recruiterName?`<span>Contact : ${escapeHtml(j.recruiterName)}</span>`:''}</div><div class="feedback-row"><button class="small" onclick="loadSaved(${i},true)">CV & lettre</button><button class="small" onclick="loadSaved(${i},false)">Correspondance</button>${j.status==='sent'||j.status==='interview'?`<button class="small" onclick="feedbackMessage(${i},'followup')">Préparer une relance</button>`:''}${j.status==='rejected'?`<button class="primary small" onclick="feedbackMessage(${i},'feedback')">Demander un retour</button><button class="small" onclick="learningBox(${i})">J’ai reçu une explication</button>`:''}</div>${j.status==='sent'||j.status==='interview'?`<div class="tracking-details"><label class="tiny">Prochaine relance<input style="width:190px;margin-left:10px" type="date" value="${j.reminder||''}" onchange="state.saved[${i}].reminder=this.value;save()"></label><p class="note">Date conservée dans le dossier ; aucun rappel envoyé par cette démo.</p></div>`:''}<div id="message${i}"></div><div id="learning${i}"></div></section>`).join(''):`<div class="panel empty"><h2>Votre première piste vous attend.</h2><p class="muted">Commencez par une offre, puis avancez étape par étape.</p><button class="primary" onclick="go('home')">Explorer une offre →</button></div>`}`};
function setTracking(i,status){if(status==='sent'&&!state.saved[i].sentAt){active=state.saved[i];openSend();return}state.saved[i].status=status;save();saved()}
function feedbackMessage(i,type){const j=state.saved[i],greeting=j.recruiterName?'Bonjour '+j.recruiterName+',':'Bonjour,';const body=greeting+'\n\n'+(type==='feedback'?'Merci pour votre retour concernant ma candidature au poste de '+j.title+'. Pour progresser, pourriez-vous m’indiquer un ou deux éléments qui auraient renforcé mon dossier ?':'Je me permets de revenir vers vous concernant ma candidature au poste de '+j.title+'. Pourriez-vous m’indiquer où en est le recrutement ?')+'\n\nMerci pour votre temps,\n'+state.profile.name;j.messageType=type;$('message'+i).innerHTML=`<div class="message-draft"><h3>${type==='feedback'?'Une demande de retour, prête à relire':'Une relance, prête à relire'}</h3><div class="fieldgrid"><label class="tiny">Nom du recruteur<input id="contactName${i}" value="${escapeHtml(j.recruiterName||'')}" oninput="state.saved[${i}].recruiterName=this.value;save()"></label><label class="tiny">Adresse e-mail<input id="contactEmail${i}" type="email" value="${escapeHtml(j.recruiterEmail||'')}" oninput="state.saved[${i}].recruiterEmail=this.value;save()"></label></div><p class="note">Si vous ajoutez un nom après coup, ajustez aussi la salutation du message.</p><textarea id="messageText${i}" aria-label="Message au recruteur">${escapeHtml(body)}</textarea><div class="feedback-row"><button class="primary small" onclick="openFollowupEmail(${i})">Ouvrir dans mon e-mail ↗</button><button class="small" onclick="copyMessage(${i})">Copier pour la plateforme</button><button class="small" onclick="openContactPlatform(${i})">Ouvrir le lien du recruteur ↗</button></div><label class="tiny">Lien du profil ou de la conversation<input id="recruiterURL${i}" type="url" value="${escapeHtml(j.recruiterURL||'')}" placeholder="Lien fourni ou ajouté par vous" oninput="state.saved[${i}].recruiterURL=this.value;save()"></label><p class="note">Le contact est renseigné par vous ou viendra d’une connexion autorisée. Aucun nom n’est deviné et aucun message n’est envoyé automatiquement.</p></div>`;}
function openFollowupEmail(i){const j=state.saved[i];if(!validEmail(j.recruiterEmail||'')){toast('Ajoutez une adresse e-mail valide.');return}window.location.href='mailto:'+encodeURIComponent(j.recruiterEmail)+'?subject='+encodeURIComponent((j.messageType==='feedback'?'Retour sur ma candidature — ':'Suivi de candidature — ')+j.title)+'&body='+encodeURIComponent($('messageText'+i).value)}
async function copyMessage(i){try{await navigator.clipboard.writeText($('messageText'+i).value);toast('Message copié. Relisez-le sur la plateforme avant d’envoyer.')}catch{toast('Sélectionnez le message et copiez-le manuellement.')}}
function openContactPlatform(i){const u=safeURL(state.saved[i].recruiterURL||'');if(!u){toast('Ajoutez le lien du profil ou de la conversation.');return}window.open(u,'_blank','noopener,noreferrer')}
function learningBox(i){const j=state.saved[i];$('learning'+i).innerHTML=`<section class="learning"><h3>Qu’avez-vous appris de ce retour ?</h3><p class="tiny muted">Un refus seul n’indique pas ce qui manque. Conservez le retour réel, puis décidez de l’action utile.</p><textarea id="employerFeedback${i}" placeholder="Collez ou résumez l’explication reçue…">${escapeHtml(j.employerFeedback||'')}</textarea><label class="tiny">Une action à envisager<input id="learningAction${i}" placeholder="Ex. vérifier mon niveau de néerlandais, mieux expliquer un projet…" value="${escapeHtml(j.learningAction||'')}"></label><button class="small" onclick="saveLearning(${i})">Valider et garder dans mon profil</button></section>`}
function saveLearning(i){const feedback=$('employerFeedback'+i).value.trim(),action=$('learningAction'+i).value.trim();if(!feedback||!action){toast('Ajoutez le retour reçu et l’action que vous choisissez.');return}const j=state.saved[i];j.employerFeedback=feedback;j.learningAction=action;state.profile.learning ||= [];const existing=state.profile.learning.find(x=>x.jobId===j.id);if(existing)Object.assign(existing,{feedback,action});else state.profile.learning.push({jobId:j.id,job:j.title,feedback,action});save();toast('Retour conservé. Vos compétences déclarées ne sont pas modifiées.');}
const profileWithLearning=profile;profile=function(){profileWithLearning();if(profileTab==='skills'&&state.profile.learning?.length){const section=document.createElement('section');section.className='learning';section.innerHTML='<h3>Ce que vos candidatures vous apprennent</h3>'+state.profile.learning.map(x=>`<div class="evidence"><b class="tiny">${escapeHtml(x.job)}</b><p class="tiny">Retour reçu : ${escapeHtml(x.feedback)}</p><p class="tiny">Votre action : ${escapeHtml(x.action)}</p></div>`).join('');document.querySelector('.profile-form > .panel').append(section)}};

render();
</script></body></html>
